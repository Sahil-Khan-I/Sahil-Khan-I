name: Generate contribution snake

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sahil-Khan-I
          outputs: |
            dist/github-snake.svg?color_snake=%237c86ff&color_dots=%23f0f0f0,%23d9d9ff,%23b5baff,%237c86ff,%234f58d6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%237c86ff&color_dots=%2316161b,%2335384f,%23545db2,%237c86ff,%23c5caff

      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
