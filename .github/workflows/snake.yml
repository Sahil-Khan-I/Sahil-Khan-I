name: Refresh GitHub profile visuals

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"
      - "scripts/generate-profile-telemetry.mjs"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sahil-Khan-I
          outputs: |
            dist/github-snake.svg?color_snake=%237c86ff&color_dots=%23f0f0f0,%23d9d9ff,%23b5baff,%237c86ff,%234f58d6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%237c86ff&color_dots=%2316161b,%2335384f,%23545db2,%237c86ff,%23c5caff

      - name: Publish contribution snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate verified public repository telemetry
        run: node scripts/generate-profile-telemetry.mjs

      - name: Commit updated telemetry images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-telemetry-light.svg assets/github-telemetry-dark.svg
          if git diff --cached --quiet; then
            echo "Telemetry unchanged."
            exit 0
          fi
          git commit -m "chore: refresh GitHub public repository telemetry"
          git push
